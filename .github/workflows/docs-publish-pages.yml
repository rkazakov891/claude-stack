name: Docs Publish (GitHub Pages, reusable)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install MkDocs
        run: |
          if [[ -f requirements-docs.txt ]]; then
            pip install -r requirements-docs.txt
          else
            pip install mkdocs-material==9.5.49 mike==2.1.3 pymdown-extensions
          fi

      - name: Configure git for mike
        run: |
          git config --local user.email "276219492+rkazakov891@users.noreply.github.com"
          git config --local user.name "Roman Kazakov"

      - name: Deploy as 'latest' (no version snapshot)
        run: |
          mike deploy --push --update-aliases latest
          mike set-default --push latest
