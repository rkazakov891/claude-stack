name: Release (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Принимаем v1.2.3 или 1.2.3
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install MkDocs
        run: |
          if [[ -f requirements-docs.txt ]]; then
            pip install -r requirements-docs.txt
          else
            pip install mkdocs-material==9.5.49 mike==2.1.3 pymdown-extensions
          fi

      - name: Configure git for mike
        run: |
          git config --local user.email "276219492+rkazakov891@users.noreply.github.com"
          git config --local user.name "Roman Kazakov"

      - name: Snapshot version with mike
        run: |
          mike deploy --push --update-aliases ${{ steps.ver.outputs.version }} latest
          mike set-default --push latest

      - name: Generate release notes from changelog
        id: notes
        run: |
          # Извлекаем секцию changelog для этой версии
          if [[ -f docs/changelog.md ]]; then
            CL_FILE=docs/changelog.md
          elif [[ -f CHANGELOG.md ]]; then
            CL_FILE=CHANGELOG.md
          else
            echo "notes=No changelog found" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Парсим: ищем `## [VERSION]` до следующего `## `
          NOTES=$(awk -v ver="${{ steps.ver.outputs.version }}" '
            /^## \[/ { if (found) exit; if ($0 ~ ver) found=1; next }
            found { print }
          ' $CL_FILE)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
